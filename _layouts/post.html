---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="subtitle">{{ page.subtitle }}</p>{% endif %}
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%-d %B %Y' }}</time>
  </header>
  <div class="post-body">
    {{ content }}
  </div>
  <p class="back"><a href="{{ '/' | relative_url }}">&larr; All posts</a></p>
</article>
